name: Build Windows EXE
on:
  push:
    branches: [main, feature/dark-professional-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore MusicDownloaderPro.sln
      - name: Test
        env:
          MDP_TEST_SCREENSHOTS: artifacts/screenshots
        run: dotnet test MusicDownloaderPro.sln -c Release --no-restore --logger trx
      - name: Publish x64
        run: dotnet publish src/MusicDownloaderPro/MusicDownloaderPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish/win-x64
      - name: Startup smoke test
        shell: pwsh
        run: |
          $logRoot = Join-Path $env:LOCALAPPDATA "MusicDownloaderPro\Logs"
          Remove-Item $logRoot -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process "artifacts/publish/win-x64/MusicDownloaderPro.exe" -PassThru
          Start-Sleep -Seconds 8
          $logs = Get-ChildItem $logRoot -Filter "*.txt" -ErrorAction SilentlyContinue
          if ($logs) {
            $logs | ForEach-Object { Get-Content $_.FullName }
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Application logged an exception during startup."
          }
          if ($process.HasExited) { throw "Application exited during startup with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MusicDownloaderPro.iss'
      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash artifacts/publish/win-x64/MusicDownloaderPro.exe, artifacts/installer/MusicDownloaderPro-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MusicDownloaderPro-Windows-x64
          path: |
            artifacts/publish/win-x64/**
            artifacts/installer/MusicDownloaderPro-Setup.exe
            artifacts/SHA256SUMS.txt
            artifacts/screenshots/**
          if-no-files-found: error
